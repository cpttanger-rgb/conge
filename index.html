<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestion des congés</title>
<style>
:root{--bg:#f6f8f8;--sf:#fff;--tx:#15262b;--mu:#5d6f74;--ln:#d9e2e4;--pr:#0f4c5c;--pr2:#e3eff1;--ok:#2f7d4f;--wa:#b86e00;--er:#a63d2f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a1d;--sf:#16262a;--tx:#e6eff1;--mu:#93a8ad;--ln:#2a3f44;--pr:#6cc0d3;--pr2:#1b3a41;--ok:#6fcf97;--wa:#f2b24c;--er:#f08a7b}}
:root[data-theme="dark"]{--bg:#0f1a1d;--sf:#16262a;--tx:#e6eff1;--mu:#93a8ad;--ln:#2a3f44;--pr:#6cc0d3;--pr2:#1b3a41;--ok:#6fcf97;--wa:#f2b24c;--er:#f08a7b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--sf);border-bottom:1px solid var(--ln);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
nav{display:flex;gap:4px}
nav button{border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:8px 14px;border-radius:6px;cursor:pointer}
nav button.on{background:var(--pr2);color:var(--pr)}
main{max-width:1100px;margin:0 auto;padding:20px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.bar .sp{flex:1}
input,select,button.b{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:7px 10px}
button.b{cursor:pointer;font-weight:600}
button.p{background:var(--pr);color:var(--sf);border-color:var(--pr)}
button.b:focus-visible,input:focus-visible,select:focus-visible,nav button:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{font-size:13px;color:var(--mu);font-weight:600}
tr:last-child td{border-bottom:0}
.tag{padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600;background:var(--pr2);color:var(--pr)}
.tag.a{color:var(--wa)}.tag.v{color:var(--ok)}.tag.r{color:var(--er)}
.meter{height:8px;background:var(--pr2);border-radius:99px;overflow:hidden;min-width:120px}
.meter i{display:block;height:100%;background:var(--pr)}
.meter i.low{background:var(--er)}
.ic{background:none;border:0;color:var(--mu);cursor:pointer;font:inherit;padding:2px 6px}
.ic:hover{color:var(--er)}
dialog{border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);padding:20px;width:min(420px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog label{display:block;font-size:13px;color:var(--mu);margin-top:10px}
dialog input,dialog select{width:100%}
.empty{padding:28px;text-align:center;color:var(--mu)}
.hint{color:var(--mu);font-size:13px;margin:8px 0 0}
#pf{display:none}
#pf,#pf *{color:#000;background:#fff}
#pf h2{font:700 20px Arial,sans-serif;margin:0;padding-bottom:8px;border-bottom:1px solid #000;display:flex;justify-content:space-between}
#pf table{border-collapse:collapse;width:100%;min-width:0;margin-bottom:12px}
#pf td,#pf th{border:1px solid #000;padding:11px 9px;white-space:normal;font:14px Arial,sans-serif;text-align:left;vertical-align:top}
#pf th{text-align:center;font-weight:700}
#pf p{font:12px Arial,sans-serif;margin:4px 0}
#pf h3{font:700 14px Arial,sans-serif;margin:0 0 8px}
#pf .bx{height:80px}
@media print{@page{size:A4;margin:14mm}body>*:not(#pf){display:none!important}body{background:#fff}#pf{display:flex;flex-direction:column;justify-content:space-between;height:265mm}#pf table{margin:0}}
.hi{background:color-mix(in srgb,var(--wa) 14%,transparent)}
</style>
</head>
<body>
<header>
  <h1>Gestion des congés</h1>
  <nav id="nav">
    <button data-v="solde" class="on">Soldes</button>
    <button data-v="conges">Congés</button>
    <button data-v="pers">Personnel</button>
  </nav>
  <button class="b" id="lockb">Verrouiller</button>
</header>
<main id="main"></main>

<dialog id="dlg"><form method="dialog" id="frm" onsubmit="return false"></form></dialog>
<input type="file" id="file" accept=".csv,text/csv" hidden>
<div id="pf"></div>

<script>
(function(){
var K="conges-app-v2",S={pers:[],conges:[],droit:22},view="solde",q="",only40=false;
function load(){try{var r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function days(a,b){if(!a||!b)return 0;var d=new Date(a+"T00:00"),e=new Date(b+"T00:00"),n=0;if(e<d)return 0;for(;d<=e;d.setDate(d.getDate()+1)){var w=d.getDay();if(w!=0&&(S.sam||w!=6))n++}return n}
function fr(d){return d?d.split("-").reverse().join("/"):""}
function pName(m){var p=S.pers.find(function(x){return x.mat==m});return p?p.nom+" "+p.prenom:m}
var SD="2026-10-25",SD1="2026-10-26";
function after(c){return days(c.debut>SD1?c.debut:SD1,c.fin)}
function yrs(e,d){var n=d.getFullYear()-e.getFullYear();if(d.getMonth()<e.getMonth()||(d.getMonth()==e.getMonth()&&d.getDate()<e.getDate()))n--;return Math.max(0,n)}
function rowsSolde(){return S.pers.filter(function(p){return p.actif!==false}).map(function(p){var u=used(p.mat),has=p.solde!=null,ac=acquis(p);return{p:p,i:S.pers.indexOf(p),u:u,has:has,ac:ac,r:has?Math.round((p.solde+ac-u)*100)/100:null}}).sort(function(a,b){return (b.r==null?-1e9:b.r)-(a.r==null?-1e9:a.r)})}
function annuel(p,d){var y=p.embauche?yrs(new Date(p.embauche+"T00:00"),d):0;return Math.min(30,18+1.5*Math.floor(y/5))}
function acquis(p){var t=new Date(),m=(t.getFullYear()-2026)*12+(t.getMonth()-9);if(t.getDate()<25)m--;var s=0;for(var k=1;k<=m;k++)s+=annuel(p,new Date(2026,9+k,25))/12;return Math.round(s*100)/100}
function used(m){return S.conges.filter(function(c){return c.mat==m&&c.statut!="Refusé"}).reduce(function(s,c){return s+after(c)},0)}
function bar(extra){return '<div class="bar"><input id="q" placeholder="Rechercher…" value="'+esc(q)+'">'+(extra||"")+'</div>'}

function render(){
  var h="";
  if(view=="solde"){
    var all=rowsSolde(),n40=all.filter(function(x){return x.r>40}).length,list=all.filter(function(x){return match(x.p)&&(!only40||x.r>40)});
    h=bar('<label><input type="checkbox" id="f40"'+(only40?" checked":"")+'> Solde &gt; 40 j seulement</label><span class="tag a">'+n40+' agent(s) &gt; 40 j</span><span class="sp"></span><label><input type="checkbox" id="sam"'+(S.sam?" checked":"")+'> Compter le samedi</label><button class="b" data-a="xlsx">Exporter Excel</button>');
    h+='<div class="tw"><table><tr><th>Matricule</th><th>Nom</th><th>Date d’embauche</th><th>Droit annuel</th><th>Solde au 25/10/2026</th><th>Acquis depuis</th><th>Pris depuis</th><th>Solde actuel</th></tr>';
    list.forEach(function(x){var p=x.p,hi=x.r>40;
      h+='<tr'+(hi?' class="hi"':'')+'><td>'+esc(p.mat)+'</td><td>'+esc(p.nom+" "+p.prenom)+'</td><td>'+(p.embauche?fr(p.embauche):"—")+'</td><td>'+annuel(p,new Date())+' j/an'+(p.embauche?"":" *")+'</td><td>'+(x.has?p.solde+' j':"—")+'</td><td>+'+x.ac+' j</td><td>−'+x.u+' j</td><td>'+(x.has?'<b>'+x.r+' j</b>'+(hi?' <span class="tag a">+40 j</span>':""):"—")+'</td></tr>'});
    h+='</table>'+(list.length?"":'<div class="empty">Aucun agent à afficher.</div>')+'</div>';
    h+='<p class="hint">Solde actuel = solde au 25/10/2026 + jours acquis − jours pris après cette date (congés refusés exclus). Acquis : droit annuel ÷ 12 par mois écoulé, crédité le 25 de chaque mois (premier crédit le 25/11/2026).</p><p class="hint">Code du travail (art. 231-232) : 1,5 jour par mois (18 j/an), plus 1,5 jour par période entière de 5 ans de service, plafond 30 j/an. * Sans date d’embauche, 18 j/an est appliqué : renseignez la date dans Personnel › Modifier.</p>';
  }else if(view=="conges"){
    var l=S.conges.filter(function(c){return !q||(pName(c.mat)+c.mat+c.titre).toLowerCase().indexOf(q.toLowerCase())>-1}).sort(function(a,b){return b.debut.localeCompare(a.debut)});
    h=bar('<span class="sp"></span><button class="b" data-a="imp-c">Importer CSV</button><button class="b" data-a="exp-c">Exporter CSV</button><button class="b" data-a="xlsx">Exporter Excel</button><button class="b p" data-a="add-c">Ajouter un congé</button>');
    h+='<div class="tw"><table><tr><th>Agent</th><th>Titre</th><th>Demande</th><th>Du</th><th>Au</th><th>Jours</th><th>Statut</th><th></th></tr>';
    l.forEach(function(c){var i=S.conges.indexOf(c),cl=c.statut=="Validé"?"v":c.statut=="Refusé"?"r":"a";
      h+='<tr><td>'+esc(pName(c.mat))+'</td><td>'+esc(c.titre)+'</td><td>'+fr(c.demande)+'</td><td>'+fr(c.debut)+'</td><td>'+fr(c.fin)+'</td><td>'+days(c.debut,c.fin)+'</td><td><select data-st="'+i+'" class="tag '+cl+'">'+["En attente","Validé","Refusé"].map(function(s){return '<option'+(s==c.statut?" selected":"")+'>'+s+'</option>'}).join("")+'</select></td><td><button class="ic" data-ed="'+i+'">Modifier</button><button class="ic" data-pr="'+i+'">Imprimer</button><button class="ic" data-del-c="'+i+'" aria-label="Supprimer">Supprimer</button></td></tr>'});
    h+='</table>'+(l.length?"":'<div class="empty">Aucun congé enregistré. Ajoutez-en un ou importez votre table Congés.</div>')+'</div>';
  }else{
    var p=S.pers.filter(match);
    h=bar('<span class="sp"></span><button class="b" data-a="imp-p">Importer CSV</button><button class="b" data-a="exp-p">Exporter CSV</button><button class="b" data-a="xlsx">Exporter Excel</button><button class="b p" data-a="add-p">Ajouter un agent</button>');
    h+='<div class="tw"><table><tr><th>Matricule</th><th>Nom</th><th>Prénom</th><th>Division</th><th>Fonction</th><th>Téléphone</th><th></th></tr>';
    p.forEach(function(x){var i=S.pers.indexOf(x);h+='<tr><td>'+esc(x.mat)+'</td><td>'+esc(x.nom)+(x.actif===false?' (ancien)':'')+'</td><td>'+esc(x.prenom)+'</td><td>'+esc(x.division)+'</td><td>'+esc(x.fonction)+'</td><td>'+esc(x.phone)+'</td><td><button class="ic" data-edp="'+i+'">Modifier</button><button class="ic" data-del-p="'+i+'">Supprimer</button></td></tr>'});
    h+='</table>'+(p.length?"":'<div class="empty">Aucun agent. Ajoutez-en un ou importez votre table Personnels.</div>')+'</div>';
  }
  document.getElementById("main").innerHTML=h;
  var qi=document.getElementById("q");if(qi){qi.oninput=function(){q=qi.value;var pos=qi.selectionStart;render();var n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)}}
  var dr=document.getElementById("droit");if(dr)dr.onchange=function(){S.droit=+dr.value||0;save();render()};
  var sm=document.getElementById("sam");if(sm)sm.onchange=function(){S.sam=sm.checked;save();render()};
}
function match(p){return !q||(p.mat+p.nom+p.prenom+p.division+p.fonction).toLowerCase().indexOf(q.toLowerCase())>-1}

function dialog(title,fields,ok){
  var f=document.getElementById("frm"),d=document.getElementById("dlg");
  f.innerHTML='<h2 style="margin:0 0 4px;font-size:18px">'+title+'</h2>'+fields+'<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button type="button" class="b" id="no">Annuler</button><button type="button" class="b p" id="yes">Enregistrer</button></div>';
  d.showModal();
  document.getElementById("no").onclick=function(){d.close()};
  document.getElementById("yes").onclick=function(){if(ok(f)!==false)d.close()};
}
function fld(id,l,t,v){return '<label>'+l+'<input id="'+id+'" type="'+(t||"text")+'" value="'+esc(v||"")+'"></label>'}
function val(id){return document.getElementById(id).value.trim()}

function addP(ix){var x=ix==null?null:S.pers[ix],g=function(k){return x&&x[k]!=null?x[k]:""};
  dialog(x?"Modifier l’agent":"Ajouter un agent",fld("m","Matricule","text",g("mat"))+fld("n","Nom","text",g("nom"))+fld("p","Prénom","text",g("prenom"))+fld("d","Division","text",g("division"))+fld("f","Fonction","text",g("fonction"))+fld("t","Téléphone","text",g("phone"))+fld("e","Date d’embauche","date",g("embauche"))+fld("s","Solde au 25/10/2026 (jours)","number",g("solde"))+'<label>Statut<select id="ac"><option value="1">Actif</option><option value="0"'+(x&&x.actif===false?" selected":"")+'>Ancien</option></select></label>',function(){
  if(!val("m")||!val("n")){alert("Le matricule et le nom sont obligatoires.");return false}
  if(S.pers.some(function(y){return y!==x&&y.mat==val("m")})){alert("Ce matricule existe déjà.");return false}
  var o={mat:val("m"),nom:val("n"),prenom:val("p"),division:val("d"),fonction:val("f"),phone:val("t"),embauche:val("e")};
  if(val("s")!=="")o.solde=+val("s");if(val("ac")=="0")o.actif=false;
  if(x){if(x.mat!=o.mat)S.conges.forEach(function(c){if(c.mat==x.mat)c.mat=o.mat});delete x.solde;delete x.actif;Object.assign(x,o)}else S.pers.push(o);
  save();render()})}
function addC(ix){var c=ix==null?null:S.conges[ix];
  if(!S.pers.length){alert("Ajoutez d’abord au moins un agent.");return}
  var t=new Date().toISOString().slice(0,10);
  dialog(c?"Modifier le congé":"Ajouter un congé",'<label>Agent<select id="a">'+S.pers.map(function(p){return '<option value="'+esc(p.mat)+'"'+(c&&c.mat==p.mat?" selected":"")+'>'+esc(p.nom+" "+p.prenom)+'</option>'}).join("")+'</select></label>'+fld("ti","Titre","text",c?c.titre:"Congé annuel")+fld("de","Date de demande","date",c?c.demande:t)+fld("db","Date de début","date",c?c.debut:"")+fld("df","Date de fin","date",c?c.fin:""),function(){
    if(!val("db")||!val("df")||val("df")<val("db")){alert("Indiquez des dates valides : la fin ne peut pas précéder le début.");return false}
    if(c){c.mat=val("a");c.titre=val("ti");c.demande=val("de");c.debut=val("db");c.fin=val("df")}else S.conges.push({mat:val("a"),titre:val("ti"),demande:val("de"),debut:val("db"),fin:val("df"),statut:"En attente"});save();render()})}

function csvParse(t){var rows=[],r=[],c="",q=false,sep=t.indexOf(";")>-1&&t.indexOf(";")<(t.indexOf(",")<0?1e9:t.indexOf(","))?";":",";
  for(var i=0;i<t.length;i++){var ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==sep){r.push(c);c=""}else if(ch=="\n"||ch=="\r"){if(ch=="\r"&&t[i+1]=="\n")i++;r.push(c);c="";rows.push(r);r=[]}else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows.filter(function(x){return x.join("").trim()})}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z]/g,"")}
function dt(s){s=(s||"").trim();var m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);if(m)return m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
function imp(kind){var fi=document.getElementById("file");fi.value="";fi.onchange=function(){var f=fi.files[0];if(!f)return;var r=new FileReader();r.onload=function(){
  var rows=csvParse(String(r.result).replace(/^\uFEFF/,"")),hd=rows.shift().map(norm),g=function(row,names){for(var i=0;i<names.length;i++){var k=hd.indexOf(names[i]);if(k>-1)return (row[k]||"").trim()}return ""},n=0;
  rows.forEach(function(w){
    if(kind=="p"){var o={mat:g(w,["matricule"]),nom:g(w,["nom"]),prenom:g(w,["prenom"]),division:g(w,["division"]),fonction:g(w,["fonction"]),phone:g(w,["phone","telephone","tel"]),embauche:dt(g(w,["datedembauche","embauche"]))};
      if(o.mat&&!S.pers.some(function(x){return x.mat==o.mat})){S.pers.push(o);n++}}
    else{var c={mat:g(w,["matricule"]),titre:g(w,["titre","type"]),demande:dt(g(w,["datededemande","demande"])),debut:dt(g(w,["datededebut","datedebut","debut"])),fin:dt(g(w,["datedefin","fin"])),statut:g(w,["statut"])||"Validé"};
      if(c.mat&&c.debut&&c.fin){S.conges.push(c);n++}}});
  save();render();alert(n+" ligne(s) importée(s).")};r.readAsText(f)};fi.click()}
function toast(t){var n=document.getElementById("toast");if(!n){n=document.createElement("div");n.id="toast";n.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:min(560px,92vw);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20";document.body.appendChild(n)}n.textContent=t;n.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){n.style.display="none"},9000)}
function direct(name,data){try{var bl=data instanceof Blob?data:new Blob([data],{type:"text/csv;charset=utf-8"}),u=URL.createObjectURL(bl),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast("Téléchargement lancé : "+name+". Si rien ne se télécharge, ouvrez l’application depuis son lien claude.ai/artifact et réessayez.")}catch(e){toast("Le téléchargement a échoué. Ouvrez l’application depuis son lien claude.ai/artifact et réessayez.")}}
function saveFile(name,data){var c=(typeof claude!=="undefined"&&claude&&claude.use)?claude:(window.claude&&window.claude.use?window.claude:null);
  if(!c){direct(name,data);return}
  c.use("downloads").then(function(d){if(!d){direct(name,data);return}return d.save({filename:name,data:data})}).catch(function(e){if(e&&e.code=="declined")return;direct(name,data)})}
function crc32(b){var t=crc32.t;if(!t){t=crc32.t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}var c=-1;for(var i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return(c^-1)>>>0}
function zip(files){var enc=new TextEncoder(),parts=[],cd=[],off=0,cds=0;
  files.forEach(function(f){var nm=enc.encode(f[0]),d=enc.encode(f[1]),crc=crc32(d),l=new DataView(new ArrayBuffer(30));
    l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(12,0x21,true);l.setUint32(14,crc,true);l.setUint32(18,d.length,true);l.setUint32(22,d.length,true);l.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(l.buffer),nm,d);
    var c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),nm);cds+=46+nm.length;off+=30+nm.length+d.length});
  var e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cds,true);e.setUint32(16,off,true);
